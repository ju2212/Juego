<style>
/* Concepto: HUD de terminal industrial sobre una escena a pantalla completa. Juego de un solo aspecto (oscuro). */
:root{
  --bg:#07090c;
  --fg:#e6eef0;
  --dim:#8fa3a8;
  --accent:#41e2d2;      /* cian de la IA de PRISMA */
  --warn:#ff9f3d;        /* naranja industrial */
  --panel:rgba(8,14,18,.66);
  --line:rgba(65,226,210,.38);
  --display:'Chakra Petch','Arial Narrow',system-ui,sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;font-family:var(--body)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}
#touch{position:fixed;inset:0;touch-action:none;z-index:2}
.hud{position:fixed;z-index:3;pointer-events:none}

/* Objetivo */
#obj{top:calc(10px + env(safe-area-inset-top,0px));left:calc(14px + env(safe-area-inset-left,0px));
  background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 12px;backdrop-filter:blur(4px)}
#obj .lbl{font:700 10px/1 var(--display);letter-spacing:.16em;color:var(--warn)}
#obj .txt{font:600 13px/1.3 var(--body);margin-top:4px}
#pips{display:flex;gap:5px;margin-top:6px}
#pips i{width:14px;height:6px;border-radius:2px;background:rgba(255,255,255,.14)}
#pips i.on{background:var(--accent);box-shadow:0 0 8px var(--accent)}

/* Diálogo de la IA */
#ai{bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);
  width:min(460px,calc(100vw - 420px));min-width:220px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:6px;padding:8px 12px;opacity:0;transition:opacity .25s;backdrop-filter:blur(4px)}
#ai.show{opacity:1}
#ai .who{font:700 10px/1 var(--display);letter-spacing:.16em;color:var(--accent)}
#ai .say{font:400 13.5px/1.4 var(--body);margin-top:4px;min-height:1.4em}

/* Botones */
#btns{position:fixed;z-index:4;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:flex-end;gap:14px}
.btn{pointer-events:auto;touch-action:none;border-radius:50%;border:1.5px solid var(--line);background:rgba(8,14,18,.5);
  color:var(--fg);font:700 11px/1 var(--display);letter-spacing:.12em;display:grid;place-items:center;cursor:pointer;
  -webkit-tap-highlight-color:transparent}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.btn.on,.btn:active{background:rgba(65,226,210,.28);border-color:var(--accent)}
#bJump{width:86px;height:86px;font-size:12px}
#bRun{width:62px;height:62px;margin-bottom:46px}
#bRun.on{color:var(--bg);background:var(--accent)}
#topr{position:fixed;z-index:4;top:calc(10px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));display:flex;gap:8px}
.chip{pointer-events:auto;border:1px solid var(--line);background:var(--panel);color:var(--dim);border-radius:6px;
  font:700 10px/1 var(--display);letter-spacing:.14em;padding:8px 10px;cursor:pointer}
.chip:focus-visible{outline:2px solid var(--accent)}

/* Joystick */
#joy{position:fixed;z-index:3;width:124px;height:124px;margin:-62px 0 0 -62px;border-radius:50%;
  border:1.5px solid var(--line);background:radial-gradient(circle,rgba(65,226,210,.10),rgba(8,14,18,.25) 70%);pointer-events:none;opacity:0;transition:opacity .15s}
#joy.show{opacity:1}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;
  background:rgba(65,226,210,.35);border:1.5px solid var(--accent);box-shadow:0 0 14px rgba(65,226,210,.4)}
#joyHint{left:calc(28px + env(safe-area-inset-left,0px));bottom:calc(28px + env(safe-area-inset-bottom,0px));
  width:110px;height:110px;border-radius:50%;border:1.5px dashed rgba(143,163,168,.35);display:grid;place-items:center;
  font:700 9px/1.3 var(--display);letter-spacing:.14em;color:var(--dim);text-align:center}

/* Pantallas */
.screen{position:fixed;inset:0;z-index:10;display:grid;place-items:center;text-align:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#loading{background:var(--bg)}
#loading p{font:700 12px/1 var(--display);letter-spacing:.3em;color:var(--accent)}
#bar{width:180px;height:3px;background:rgba(255,255,255,.1);margin:14px auto 0;overflow:hidden;border-radius:2px}
#bar i{display:block;height:100%;width:40%;background:var(--accent);animation:load 1.1s ease-in-out infinite}
@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
#title{background:linear-gradient(90deg,rgba(7,9,12,.92) 0%,rgba(7,9,12,.55) 55%,rgba(7,9,12,.15) 100%);place-items:center start}
#title .wrap{max-width:440px;text-align:left;padding-left:4vw}
#title .kick{font:700 11px/1 var(--display);letter-spacing:.3em;color:var(--warn)}
#title h1{font:700 clamp(40px,9vw,76px)/.92 var(--display);margin:10px 0 8px;letter-spacing:.02em;text-wrap:balance}
#title h1 span{color:var(--accent)}
#title .sub{font:400 14px/1.5 var(--body);color:var(--dim);max-width:38ch}
#start{margin-top:20px;font:700 14px/1 var(--display);letter-spacing:.2em;color:var(--bg);background:var(--accent);
  border:0;border-radius:4px;padding:14px 26px;cursor:pointer;box-shadow:0 0 24px rgba(65,226,210,.35)}
#start:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
#title .meta{margin-top:16px;font:500 10px/1.4 var(--display);letter-spacing:.18em;color:var(--dim)}
#rotate{background:var(--bg);display:none}
#rotate p{font:700 14px/1.5 var(--display);letter-spacing:.14em;color:var(--fg)}
#rotate .ph{width:46px;height:78px;border:2px solid var(--accent);border-radius:8px;margin:0 auto 18px;animation:rot 2s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (max-width:900px){#rotate{display:grid}}
#toast{left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font:700 12px/1 var(--display);
  letter-spacing:.2em;color:var(--accent);opacity:0;transition:opacity .3s}
#toast.show{opacity:1}
#fps{bottom:calc(4px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);font:500 9px/1 var(--display);color:var(--dim);opacity:.6}
@media (prefers-reduced-motion:reduce){#bar i,#rotate .ph{animation:none}}
</style>

<script src="https://cdn.jsdelivr.net/npm/babylonjs@8.56.0/babylon.js"></script>
<script>
"use strict";
(function(){
const B = BABYLON, V3 = B.Vector3, C3 = B.Color3;
const $ = id => document.getElementById(id);
const canvas = $('c');
const engine = new B.Engine(canvas, true, {stencil:true, powerPreference:'high-performance'}, false);
let dpr = Math.min(window.devicePixelRatio || 1, 1.5);
engine.setHardwareScalingLevel(1 / dpr);
const scene = new B.Scene(engine);
scene.clearColor = new B.Color4(0.03, 0.035, 0.045, 1);
scene.ambientColor = new C3(0.25, 0.27, 0.3);
scene.collisionsEnabled = true;
scene.skipPointerMovePicking = true;
scene.fogMode = B.Scene.FOGMODE_EXP2;
scene.fogDensity = 0.014;
scene.fogColor = new C3(0.07, 0.085, 0.1);
const ip = scene.imageProcessingConfiguration;
ip.toneMappingEnabled = true;
ip.toneMappingType = B.ImageProcessingConfiguration.TONEMAPPING_ACES;
ip.exposure = 1.25; ip.contrast = 1.18;
ip.vignetteEnabled = true; ip.vignetteWeight = 2.2; ip.vignetteColor = new B.Color4(0,0,0,0);

/* ---------- Texturas procedurales (sin descargas) ---------- */
function rng(seed){ let s = seed >>> 0; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }
function vnoise(size, cells, seed){
  const r = rng(seed), g = new Float32Array(cells * cells);
  for (let i = 0; i < g.length; i++) g[i] = r();
  const out = new Float32Array(size * size);
  for (let y = 0; y < size; y++){
    const fy = y / size * cells, iy = fy | 0, ty = fy - iy, sy = ty * ty * (3 - 2 * ty), y0 = iy * cells, y1 = ((iy + 1) % cells) * cells;
    for (let x = 0; x < size; x++){
      const fx = x / size * cells, ix = fx | 0, tx = fx - ix, sx = tx * tx * (3 - 2 * tx), x1 = (ix + 1) % cells;
      const a = g[y0 + ix], b = g[y0 + x1], c = g[y1 + ix], d = g[y1 + x1];
      out[y * size + x] = a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy;
    }
  }
  return out;
}
function fbm(size, seed, oct, base){
  const out = new Float32Array(size * size); let amp = 1, tot = 0;
  for (let o = 0; o < oct; o++){
    const n = vnoise(size, base << o, seed + o * 17);
    for (let i = 0; i < out.length; i++) out[i] += n[i] * amp;
    tot += amp; amp *= 0.5;
  }
  for (let i = 0; i < out.length; i++) out[i] /= tot;
  return out;
}
function canvasOf(w, h){ const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function fromHeight(size, hgt, colorFn){
  const cv = canvasOf(size, size), g = cv.getContext('2d'), im = g.createImageData(size, size);
  for (let i = 0; i < size * size; i++){ const c = colorFn(hgt[i], i); im.data[i*4] = c[0]; im.data[i*4+1] = c[1]; im.data[i*4+2] = c[2]; im.data[i*4+3] = 255; }
  g.putImageData(im, 0, 0); return cv;
}
function normalMap(size, hgt, strength){
  const cv = canvasOf(size, size), g = cv.getContext('2d'), im = g.createImageData(size, size);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++){
    const l = hgt[y * size + ((x - 1 + size) % size)], r = hgt[y * size + ((x + 1) % size)];
    const u = hgt[((y - 1 + size) % size) * size + x], d = hgt[((y + 1) % size) * size + x];
    let nx = (l - r) * strength, ny = (u - d) * strength, nz = 1; const len = Math.hypot(nx, ny, nz);
    const i = (y * size + x) * 4;
    im.data[i] = (nx / len * 0.5 + 0.5) * 255; im.data[i+1] = (ny / len * 0.5 + 0.5) * 255; im.data[i+2] = (nz / len * 0.5 + 0.5) * 255; im.data[i+3] = 255;
  }
  g.putImageData(im, 0, 0); return cv;
}
function tex(cv, u, v, name){
  const t = new B.DynamicTexture(name || 'dt', cv, scene, true);
  t.update(false); t.wrapU = t.wrapV = B.Texture.WRAP_ADDRESSMODE; t.uScale = u || 1; t.vScale = v || 1; t.anisotropicFilteringLevel = 4;
  return t;
}
function heightCanvas(size, hgt){ return fromHeight(size, hgt, h => { const v = h * 255; return [v, v, v]; }); }

// Hormigón del piso
const S = 512;
const hConc = fbm(S, 11, 6, 4), hFine = fbm(S, 23, 3, 64);
for (let i = 0; i < hConc.length; i++) hConc[i] = hConc[i] * 0.7 + hFine[i] * 0.3;
const cvConc = fromHeight(S, hConc, (h, i) => {
  const x = i % S, y = (i / S) | 0;
  let v = 92 + (h - 0.5) * 70; if (x < 3 || y < 3) v *= 0.55;
  const stain = hConc[(i * 7) % hConc.length] > 0.66 ? 0.8 : 1;
  return [v * stain * 0.97, v * stain, v * stain * 1.02];
});
// Chapa acanalada de las paredes
const W = 256, hWall = fbm(W, 5, 4, 8);
const cvWall = fromHeight(W, hWall, (h, i) => {
  const x = i % W, y = (i / W) | 0;
  const rib = 0.5 + 0.5 * Math.sin(x / W * Math.PI * 2 * 10);
  let v = 70 + rib * 30 + (h - 0.5) * 40;
  const rust = Math.max(0, Math.sin(x * 0.11 + 1.3) - 0.93) * 8 * (y / W);
  return [v * 0.86 + rust * 60, v * 0.94 + rust * 25, v * 1.04];
});
const hWallN = new Float32Array(W * W);
for (let i = 0; i < hWallN.length; i++){ const x = i % W; hWallN[i] = 0.5 + 0.5 * Math.sin(x / W * Math.PI * 2 * 10); }
// Rejilla de la pasarela
const cvGrate = (() => { const c = canvasOf(128, 128), g = c.getContext('2d');
  g.fillStyle = '#3a3f44'; g.fillRect(0, 0, 128, 128); g.fillStyle = '#0b0d0f';
  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) g.fillRect(x * 16 + 3, y * 16 + 3, 10, 10);
  return c; })();
// Franjas de peligro
const cvHaz = (() => { const c = canvasOf(256, 64), g = c.getContext('2d');
  g.fillStyle = '#121212'; g.fillRect(0, 0, 256, 64); g.fillStyle = '#d9a514';
  for (let x = -64; x < 320; x += 48){ g.beginPath(); g.moveTo(x, 64); g.lineTo(x + 24, 64); g.lineTo(x + 88, 0); g.lineTo(x + 64, 0); g.fill(); }
  const r = rng(3); g.fillStyle = 'rgba(20,20,20,.5)'; for (let i = 0; i < 300; i++) g.fillRect(r() * 256, r() * 64, 2 + r() * 4, 1 + r() * 2);
  return c; })();
// Cajas de embalaje de PRISMA
const cvCrate = (() => { const c = canvasOf(256, 256), g = c.getContext('2d'), r = rng(9);
  g.fillStyle = '#2b3640'; g.fillRect(0, 0, 256, 256);
  g.strokeStyle = '#46576a'; g.lineWidth = 14; g.strokeRect(7, 7, 242, 242);
  g.fillStyle = 'rgba(0,0,0,.25)'; for (let i = 0; i < 500; i++) g.fillRect(r() * 256, r() * 256, 1 + r() * 6, 1);
  g.fillStyle = '#d7e3e6'; g.font = 'bold 44px Arial'; g.textAlign = 'center'; g.fillText('PRISMA', 128, 118);
  g.font = 'bold 15px Arial'; g.fillStyle = '#9fb3ba'; g.fillText('VENTANA INTELIGENTE · ALU-7', 128, 146);
  g.fillStyle = '#ff9f3d'; g.fillText('▲ ▲  ESTE LADO ARRIBA', 128, 196);
  return c; })();
// Mercadería envuelta en film
const cvWrap = fromHeight(128, fbm(128, 41, 4, 4), h => { const v = 150 + (h - 0.5) * 80; return [v * 0.9, v * 0.97, v * 1.05]; });
// Racks de servidores (LEDs)
const cvRack = (() => { const c = canvasOf(128, 256), g = c.getContext('2d'), r = rng(77);
  g.fillStyle = '#000'; g.fillRect(0, 0, 128, 256);
  for (let y = 6; y < 256; y += 10) for (let x = 10; x < 120; x += 9){ const p = r();
    g.fillStyle = p < 0.55 ? '#000' : p < 0.8 ? '#21e6c8' : p < 0.95 ? '#38ff6a' : '#ff3030'; g.fillRect(x, y, 4, 2); }
  return c; })();
// Pantallas con texto glitch
const cvScreen = (() => { const c = canvasOf(256, 160), g = c.getContext('2d'), r = rng(5);
  g.fillStyle = '#02100f'; g.fillRect(0, 0, 256, 160); g.font = 'bold 13px monospace';
  const L = ['> NUCLEO PRISMA: SIN RESPUESTA', '> CONTROL EXTERNO DETECTADO', '> LINEA 3 ......... OFFLINE', '> ACCESO DENEGADO', '> busco_humanos.exe', '> ERR 0x5A1D'];
  L.forEach((t, i) => { g.fillStyle = i === 3 ? '#ff4d4d' : '#3df0dc'; g.fillText(t, 10, 22 + i * 22); });
  for (let i = 0; i < 12; i++){ g.fillStyle = 'rgba(61,240,220,.25)'; g.fillRect(0, r() * 160, 256, 1); }
  return c; })();
// Cartel PRISMA
const cvSign = (() => { const c = canvasOf(1024, 256), g = c.getContext('2d');
  g.clearRect(0, 0, 1024, 256);
  g.strokeStyle = '#41e2d2'; g.lineWidth = 12; g.beginPath(); g.moveTo(70, 200); g.lineTo(150, 50); g.lineTo(230, 200); g.closePath(); g.stroke();
  g.fillStyle = '#ffffff'; g.font = 'bold 150px Arial'; g.textBaseline = 'middle'; g.fillText('PRISMA', 280, 132);
  return c; })();
// Paisaje exterior: cielo contaminado y sierras de Tandil (con la Piedra Movediza)
const cvSky = (() => { const w = 2048, h = 512, c = canvasOf(w, h), g = c.getContext('2d'), r = rng(31);
  const gr = g.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0, '#120f16'); gr.addColorStop(0.45, '#4a2a22'); gr.addColorStop(0.72, '#b8612c'); gr.addColorStop(1, '#5a3424');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  const sg = g.createRadialGradient(1300, 330, 5, 1300, 330, 160); sg.addColorStop(0, 'rgba(255,214,150,.95)'); sg.addColorStop(1, 'rgba(255,140,60,0)');
  g.fillStyle = sg; g.fillRect(1100, 150, 400, 360);
  for (let i = 0; i < 14; i++){ g.fillStyle = 'rgba(60,35,30,' + (0.15 + r() * 0.25) + ')'; g.fillRect(0, 120 + r() * 220, w, 4 + r() * 14); }
  function ridge(base, amp, color, seed, freq){ const rr = rng(seed); const pts = []; let v = 0;
    for (let x = 0; x <= w; x += 16){ v += (rr() - 0.5) * amp * 0.35; v *= 0.92; pts.push([x, base - Math.abs(Math.sin(x / w * Math.PI * freq + seed)) * amp - v]); }
    g.fillStyle = color; g.beginPath(); g.moveTo(0, h); pts.forEach(p => g.lineTo(p[0], p[1])); g.lineTo(w, h); g.fill(); return pts; }
  ridge(400, 90, '#5b3b3a', 4, 3);
  const mid = ridge(430, 110, '#3a2629', 8, 2.2);
  // Piedra Movediza sobre una loma
  const px = 700, py = mid[Math.round(px / 16)][1];
  g.fillStyle = '#1f1517'; g.beginPath(); g.ellipse(px, py - 22, 34, 20, -0.25, 0, Math.PI * 2); g.fill();
  g.fillRect(px - 3, py - 6, 6, 8);
  // Molinos eólicos rotos
  g.strokeStyle = '#2a1c1e'; g.lineWidth = 3;
  [[1550, 380], [1640, 395], [1760, 372]].forEach(([x, y], i) => { g.beginPath(); g.moveTo(x, y); g.lineTo(x, y - 90); g.stroke();
    g.beginPath(); g.moveTo(x, y - 90); g.lineTo(x + 34, y - 112 + i * 20); g.moveTo(x, y - 90); g.lineTo(x - 30, y - 70); g.stroke(); });
  ridge(470, 60, '#1c1315', 15, 4);
  // Ruinas de ciudad con pocas luces
  for (let x = 0; x < 600; x += 18 + r() * 20){ const bh = 20 + r() * 70; g.fillStyle = '#140e10'; g.fillRect(x, 480 - bh, 16 + r() * 18, bh + 40);
    for (let k = 0; k < 3; k++) if (r() < 0.3){ g.fillStyle = '#ffb35a'; g.fillRect(x + 3 + r() * 10, 480 - bh + 6 + r() * (bh - 10), 2, 2); } }
  return c; })();
const cvDirt = fromHeight(256, fbm(256, 61, 5, 4), h => { const v = 60 + (h - 0.5) * 60; return [v * 1.15, v * 0.92, v * 0.75]; });
const cvShaft = (() => { const c = canvasOf(8, 128), g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 128);

const groups = new Map(), colliders = [];
function addStatic(m, key, cast){
  const k = m.material.name + (cast ? '|s' : '');
  if (!groups.has(k)) groups.set(k, {list: [], cast});

}
function collider(w, h, d, x, y, z, rot){
  const c = B.MeshBuilder.CreateBox('col', {width: w, height: h, depth: d}, scene);
  c.position.set(x, y + h / 2, z); if (rot){ c.rotation.x = rot.x || 0; c.rotation.y = rot.y || 0; c.rotation.z = rot.z || 0; }
  c.isVisible = false; c.checkCollisions = true; c.isPickable = false; c.freezeWorldMatrix();
  colliders.push(c); return c;
}
// box(ancho, alto, profundidad, x, yBase, z, material, opciones)
function box(w, h, d, x, y, z, m, o = {}){
  const b = B.MeshBuilder.CreateBox('b', {width: w, height: h, depth: d, wrap: true}, scene);
  b.position.set(x, y + h / 2, z);
  if (o.ry) b.rotation.y = o.ry; if (o.rx) b.rotation.x = o.rx; if (o.rz) b.rotation.z = o.rz;
  b.material = m;
  if (o.col !== false && !o.nocol) collider(w, h, d, x, y, z, {x: o.rx, y: o.ry, z: o.rz});
  if (o.dyn) return b;
  addStatic(b, m, o.cast);
  return b;
}
function cyl(dia, h, x, y, z, m, o = {}){
  const c = B.MeshBuilder.CreateCylinder('c', {diameter: dia, height: h, tessellation: o.tess || 16}, scene);
  c.position.set(x, o.rz ? y : y + h / 2, z); c.material = m;

  if (o.col) collider(dia * 0.8, h, dia * 0.8, x, y, z);
  if (o.dyn) return c;
  addStatic(c, m, o.cast); return c;
}

    L.elL.rotation.x = -0.25 - amp * 0.5; L.elR.rotation.x = -0.25 - amp * 0.5;
    L.shL.rotation.z = -0.08; L.shR.rotation.z = 0.08;
    pelvis.position.y = 0.95 - Math.abs(c) * 0.05 * amp + (spd < 0.2 ? Math.sin(t * 2) * 0.008 : 0);
    pelvis.rotation.x = amp * 0.18;
  } else {
    const up = vy > 0;
    L.hipL.rotation.x = up ? -0.9 : -0.5; L.hipR.rotation.x = up ? 0.25 : 0.1;
    L.kneeL.rotation.x = up ? 1.2 : 0.6; L.kneeR.rotation.x = up ? 0.5 : 0.4;
    L.shL.rotation.x = -2.2; L.shR.rotation.x = -2.0; L.shL.rotation.z = -0.5; L.shR.rotation.z = 0.5;
    L.elL.rotation.x = -0.4; L.elR.rotation.x = -0.4; pelvis.rotation.x = 0.1;
  }

  // Cámara
  camTarget.set(player.position.x, player.position.y + 1.55, player.position.z);
  const rx = Math.cos(camYaw) * 0.35, rz = -Math.sin(camYaw) * 0.35;
  camTarget.x += rx; camTarget.z += rz;
  const cp = Math.cos(camPitch);
  const dir = new V3(-Math.sin(camYaw) * cp, Math.sin(camPitch), -Math.cos(camYaw) * cp);
  ray.origin.copyFrom(camTarget); ray.direction.copyFrom(dir); ray.length = camDist + 0.3;
  const hit = scene.pickWithRay(ray, camPred);
  const d = hit && hit.hit ? Math.max(0.6, hit.distance - 0.3) : camDist;
  camCur += (d - camCur) * (d < camCur ? 1 : 1 - Math.exp(-4 * dt));
  camPos.copyFrom(camTarget).addInPlace(dir.scale(camCur));
  cam.position.copyFrom(camPos); cam.setTarget(camTarget);
  sun.position.set(player.position.x + 10, 30, player.position.z + 15);
  dustAnchor.position.copyFrom(player.position);

  // Celdas
  cells.forEach(c => {
    if (c.taken) return;
    const dx = c.n.position.x - player.position.x, dyy = c.n.position.y - (player.position.y + 0.9), dz = c.n.position.z - player.position.z;
    if (dx * dx + dyy * dyy + dz * dz < 1.3){
      c.taken = true; c.n.setEnabled(false); got++;
      $('cnt').textContent = got + '/5'; document.querySelectorAll('#pips i').forEach((p, i) => p.classList.toggle('on', i < got));
      blip(520, 1040, 0.25, 'sine', 0.12); setTimeout(() => blip(780, 1560, 0.2, 'sine', 0.08), 90);
      toast('CELDA DE ENERGÍA ' + got + '/5');
      if (got < 5) say(lines.got[got - 1]); else say(...lines.done);
    }
  });
  // Diálogos por lugar
  const p = player.position;
  if (p.x < -17 && p.z < -7) once('server', lines.server);
  if (p.z > 13 && p.x > 15) once('door', lines.door);
  if (p.y > 2.5 && p.x < 14 && p.z > 14) once('ramp', lines.ramp);
  if (usedJoy || keys.KeyW) idleT += dt; if (idleT > 25 && !running) once('idle', lines.idle);

  updateDialog(dt);
  if (toastT > 0){ toastT -= dt; if (toastT <= 0) $('toast').classList.remove('show'); }

  // Calidad adaptativa: si el celular sufre, bajamos resolución y efectos
  fpsAcc += engine.getFps(); fpsN++;
  if (fpsN >= 180){
    const avg = fpsAcc / fpsN; fpsAcc = 0; fpsN = 0;
    if (avg < 32 && quality === 2 && dpr > 1){ quality = 1; engine.setHardwareScalingLevel(1); }
    else if (avg < 28 && quality >= 1){ quality = 0; glow.intensity = 0; glow.isEnabled = false; dust.stop(); shadows.filteringQuality = B.ShadowGenerator.QUALITY_LOW; shafts.forEach(s => s.setEnabled(false)); }
  }
  if (showFps) $('fps').textContent = engine.getFps().toFixed(0) + ' FPS · calidad ' + quality;
});
const showFps = /fps/.test(location.hash);

/* ---------- Arranque ---------- */
dust.start();
scene.activeCamera = cam;
scene.executeWhenReady(() => {
  $('loading').hidden = true; $('title').hidden = false;
});
$('start').addEventListener('click', () => {
  ensureAudio(); blip(300, 600, 0.3, 'sine', 0.08);
  if (matchMedia('(pointer:coarse)').matches) goFullscreen(true);
  $('title').hidden = true; ['obj', 'btns', 'topr'].forEach(id => $(id).hidden = false);
  if (matchMedia('(pointer:coarse)').matches) $('joyHint').hidden = false;
  started = true; camYaw = 0; camPitch = 0.28;
  setTimeout(() => say(...lines.intro), 700);
});
engine.runRenderLoop(() => scene.render());
addEventListener('resize', () => engine.resize());
window.__game = {scene, player, get grounded(){ return grounded; }, input, joyVec: v => { joyVec = v; }, start: () => $('start').click()};
})();
</script>
